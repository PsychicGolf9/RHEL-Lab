- name: Establish WireGuard server config
  ansible.builtin.template:
    src: wg0.conf.j2
    dest: /etc/wireguard/wg0.conf
    mode: '0600'
    owner: root
    group: root
  notify: Restart wg-quick
  no_log: true


- name: Allow WG handshake
  ansible.posix.firewalld:
    zone: "{{ item }}"
    port: "{{ wg_port }}/udp"
    permanent: true
    immediate: true
    state: enabled
  loop:
    - public
    - drop

- name: Enable and start WireGuard
  ansible.builtin.systemd:
    name: wg-quick@wg0
    enabled: true
    state: started
